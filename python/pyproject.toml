[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myuri"
version = "2.3.1"
description = "API-agnostic human-like browser cursor, keyboard, and scroll simulation. Bring your own driver (Playwright, CDP, or custom)."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jake Writer" }]
requires-python = ">=3.11"
keywords = ["playwright", "cdp", "automation", "human-like", "mouse", "cursor", "typing", "scroll", "anti-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["cursory>=2.0.0,<3"]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.40", "mypy>=1.8", "ruff>=0.5,<0.16"]

[project.urls]
Homepage = "https://github.com/JWriter20/Myuri"
Issues = "https://github.com/JWriter20/Myuri/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/myuri"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
