name: Publish

# Auto-publishes when a new version lands on main. Each job is version-guarded:
# it only publishes if that package's version isn't already released, so ordinary
# pushes are no-ops and a version bump triggers a release.
#
# Setup required (one-time):
#   - npm: uses OIDC *trusted publishing* — no tokens/secrets. On npmjs.com, under
#     the @jobharvest org, open the @jobharvest/myuri package settings → "Trusted
#     Publisher" and add GitHub Actions with:
#         Organization/user: JWriter20   Repository: Myuri   Workflow: publish.yml
#     (npm requires the package to exist to configure this. For the very first
#     publish, do one bootstrap `npm publish` from your machine while logged in to
#     the org; every CI publish after that is tokenless via OIDC.)
#   - Python: nothing. Public PyPI has no private/scoped packages, so the wheel is
#     attached to a GitHub Release on this private repo instead. Consumers install
#     from the private repo, e.g.:
#       pip install "git+https://github.com/JWriter20/Myuri.git@myuri-v2.0.0#subdirectory=python"

on:
  push:
    branches: [main]

jobs:
  npm:
    name: npm (@jobharvest/myuri, private)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@jobharvest'
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Publish if version is new
        # Provenance is disabled: attestations are public and require a public
        # package, but this one is restricted/private. OIDC auth is unaffected.
        #
        # The publish is idempotent rather than guarded by `npm view`: a restricted
        # package can't be viewed without auth, and CI has no token (OIDC only mints
        # one at publish time), so `npm view` always 404s and can't gate anything.
        # Instead we just try to publish; if the registry rejects it because the
        # version already exists, that's a no-op (unbumped push), not a failure.
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing @jobharvest/myuri@$VERSION via OIDC trusted publishing"
          npm run build
          if npm publish --access restricted 2>err.log; then
            echo "Published $VERSION"
          elif grep -q "previously published versions" err.log; then
            echo "@jobharvest/myuri@$VERSION already published — no-op."
          else
            cat err.log >&2
            exit 1
          fi

  python:
    name: python (private, GitHub Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + releases on this private repo
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release wheel if version is new
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="myuri-v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "$TAG already released — skipping."
          else
            echo "Releasing $TAG"
            pip install build
            python -m build
            gh release create "$TAG" dist/* \
              --title "myuri (python) v$VERSION" \
              --notes "Private release. Install: pip install \"git+https://github.com/JWriter20/Myuri.git@$TAG#subdirectory=python\""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
