name: Publish

# Auto-versioned release. Every push to main computes the next SemVer from the
# Conventional-Commit subjects since the last `myuri-v*` tag — `!`/BREAKING → major,
# `feat` → minor, anything else → patch (patch is the floor, so every merge ships) —
# then publishes both packages at that version and records it back:
#   - npm  (@jwriter20/myuri, public; plain `myuri` is blocked as too similar to `mri`): tokenless via OIDC trusted publishing
#   - PyPI (myuri): tokenless via OIDC trusted publishing
# The bump is committed as `release: v<ver> [skip ci]`; the [skip ci] keeps that
# commit from re-triggering this workflow.
#
# One-time setup (by the account owner, no tokens or secrets in this repo):
#   - npm: trusted publishing cannot create a package, so the first version of
#     `@jwriter20/myuri` is published by hand (`npm publish` in js/ as jwriter20). Then
#     npmjs.com → @jwriter20/myuri → Settings → Trusted Publisher → GitHub Actions
#     (JWriter20/Myuri, publish.yml).
#   - PyPI: pypi.org/manage/account/publishing → add a pending publisher
#     (project myuri, owner JWriter20, repo Myuri, workflow publish.yml, no
#     environment). The first run creates the project.

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    # Never react to our own release commit (belt-and-suspenders with [skip ci]).
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing (npm)
      contents: write # push the version bump + tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the semantic bump
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute next version
        id: ver
        run: |
          LAST=$(git tag -l 'myuri-v*' | sed 's/^myuri-v//' | sort -V | tail -1)
          [ -z "$LAST" ] && LAST=$(node -p "require('./js/package.json').version")
          RANGE=HEAD
          git rev-parse -q --verify "myuri-v$LAST^{commit}" >/dev/null && RANGE="myuri-v$LAST..HEAD"
          LOG=$(git log --format='%s%n%b' "$RANGE")
          LEVEL=patch
          if echo "$LOG" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            LEVEL=major
          elif echo "$LOG" | grep -qE '^feat(\(.+\))?:'; then
            LEVEL=minor
          fi
          IFS=. read -r MA MI PA <<<"$LAST"
          case "$LEVEL" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          echo "last=$LAST level=$LEVEL next=$NEXT"
          echo "next=$NEXT" >>"$GITHUB_OUTPUT"

      - name: Publish npm (@jwriter20/myuri) via OIDC
        id: npm
        # A failed npm publish must not hold back the PyPI release.
        continue-on-error: true
        working-directory: js
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          # Provenance needs a public source repository; this one is private.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@^11.5.1
          npm ci
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          npm run build
          # Idempotent: a re-run after a partial failure must not red-fail on a
          # version that already made it to the registry.
          if npm publish --access public 2>err.log; then
            echo "Published @jwriter20/myuri@$NEXT"
          elif grep -q "previously published versions" err.log; then
            echo "@jwriter20/myuri@$NEXT already on npm — no-op."
          else
            cat err.log >&2; exit 1
          fi

      - name: Build python wheel and sdist
        working-directory: python
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$NEXT\"/" pyproject.toml
          pip install build
          python -m build

      - name: Publish PyPI (myuri) via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

      - name: Record release (commit + tag)
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          TAG="myuri-v$NEXT"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "release: v$NEXT [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
