name: Publish

# Auto-versioned release. Every push to main computes the next SemVer from the
# Conventional-Commit subjects since the last `myuri-v*` tag — `!`/BREAKING → major,
# `feat` → minor, anything else → patch (patch is the floor, so every merge ships) —
# then publishes both packages at that version and records it back:
#   - npm  (@jobharvest/myuri, restricted): tokenless via OIDC trusted publishing
#   - python: wheel attached to a GitHub Release on this private repo
#     (pip install "git+https://github.com/JWriter20/Myuri.git@myuri-v<ver>#subdirectory=python")
# The bump is committed as `release: v<ver> [skip ci]`; the [skip ci] keeps that
# commit from re-triggering this workflow.
#
# One-time npm setup (already done): npmjs.com → @jobharvest/myuri → Trusted
# Publisher → GitHub Actions (JWriter20/Myuri, publish.yml). No tokens/secrets.

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    # Never react to our own release commit (belt-and-suspenders with [skip ci]).
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing (npm)
      contents: write # push the version bump + tag, create the GitHub Release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the semantic bump
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@jobharvest'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Compute next version
        id: ver
        run: |
          LAST=$(git tag -l 'myuri-v*' | sed 's/^myuri-v//' | sort -V | tail -1)
          [ -z "$LAST" ] && LAST=$(node -p "require('./js/package.json').version")
          RANGE=HEAD
          git rev-parse -q --verify "myuri-v$LAST^{commit}" >/dev/null && RANGE="myuri-v$LAST..HEAD"
          LOG=$(git log --format='%s%n%b' "$RANGE")
          LEVEL=patch
          if echo "$LOG" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            LEVEL=major
          elif echo "$LOG" | grep -qE '^feat(\(.+\))?:'; then
            LEVEL=minor
          fi
          IFS=. read -r MA MI PA <<<"$LAST"
          case "$LEVEL" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          echo "last=$LAST level=$LEVEL next=$NEXT"
          echo "next=$NEXT" >>"$GITHUB_OUTPUT"

      - name: Publish npm (@jobharvest/myuri) via OIDC
        working-directory: js
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          # Provenance needs a public package; this one is restricted, so disable it.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          npm ci
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          npm run build
          # Idempotent: a re-run after a partial failure must not red-fail on a
          # version that already made it to the registry.
          if npm publish --access restricted 2>err.log; then
            echo "Published @jobharvest/myuri@$NEXT"
          elif grep -q "previously published versions" err.log; then
            echo "@jobharvest/myuri@$NEXT already on npm — no-op."
          else
            cat err.log >&2; exit 1
          fi

      - name: Build python wheel
        working-directory: python
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$NEXT\"/" pyproject.toml
          pip install build
          python -m build

      - name: Record release (commit + tag + GitHub Release)
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          TAG="myuri-v$NEXT"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "release: v$NEXT [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
          gh release create "$TAG" python/dist/* \
            --title "myuri v$NEXT" \
            --notes "npm: @jobharvest/myuri@$NEXT · pip: pip install \"git+https://github.com/JWriter20/Myuri.git@$TAG#subdirectory=python\""
